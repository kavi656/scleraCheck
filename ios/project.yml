# XcodeGen spec. Generate the Xcode project with:  cd ios && xcodegen generate
name: ScleraCheck
options:
  bundleIdPrefix: com.scleracheck
  deploymentTarget:
    iOS: "16.0"
packages:
  ScleraCore:
    path: ScleraCore
targets:
  ScleraCheck:
    type: application
    platform: iOS
    sources: [ScleraCheck]
    dependencies:
      - package: ScleraCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.scleracheck.app
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 4TN2UWKGF8
        # Set your Team in Xcode (Signing & Capabilities) — a free Apple ID works for your own phone.
        INFOPLIST_KEY_NSCameraUsageDescription: "ScleraCheck uses the camera to measure the colour of the white of your eye. Images never leave the phone."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: ScleraCheck
        # Developer data (CSV + masked patches) visible in Finder / Files app, like `adb pull` on Android.
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
